name: Generar post del día

on:
  schedule:
    - cron: "0 10 * * *" # 07:00 en Paraguay (UTC-3)
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha AAAA-MM-DD (vacío = hoy)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: posts
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Si existe CLAUDE_CODE_OAUTH_TOKEN usa tu suscripción de Claude (Claude Code);
      # si no, usa la API con ANTHROPIC_API_KEY (pago por uso).
      - name: Generar texto y slides
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FECHA: ${{ inputs.fecha }}
        run: |
          # Al copiar el token de la terminal a veces se cuela un salto de línea
          export CLAUDE_CODE_OAUTH_TOKEN=$(printf %s "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            npm install -g @anthropic-ai/claude-code
            PEDIDO=$(python bot/generar.py --preparar $FECHA)
            FECHA_POST=$(basename "$(dirname "$PEDIDO")")
            unset ANTHROPIC_API_KEY
            claude -p "$(cat "$PEDIDO")" \
              --permission-mode dontAsk \
              --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(python bot/generar.py --validar *)" \
              --output-format text
            python bot/generar.py --terminar "$FECHA_POST"
          else
            python bot/generar.py $FECHA
          fi

      - name: Sumar quién comentó INFO
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python bot/informe_info.py >> "posts/${{ steps.gen.outputs.fecha }}/issue.md" || echo "No se pudo leer Threads"

      - name: Guardar en el repo
        run: |
          git config user.name "tino-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts
          git commit -m "Borrador ${{ steps.gen.outputs.fecha }}"
          git pull --rebase
          git push

      - name: Publicar directo (modo automático)
        if: vars.PUBLICAR_AUTOMATICO == 'true'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          python bot/publicar.py "${{ steps.gen.outputs.fecha }}"
          git add posts
          git commit -m "Publicado ${{ steps.gen.outputs.fecha }}"
          git pull --rebase
          git push

      - name: Abrir borrador para aprobar
        if: vars.PUBLICAR_AUTOMATICO != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create borrador --color F7C33A --description "Post esperando aprobación" --force
          gh issue create \
            --title "Borrador ${{ steps.gen.outputs.fecha }}" \
            --body-file "posts/${{ steps.gen.outputs.fecha }}/issue.md" \
            --label borrador \
            --assignee "${{ github.repository_owner }}"
